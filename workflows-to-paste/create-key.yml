name: 1 - Create signing key

on:
  workflow_dispatch:

jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate the key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Add the KEYSTORE_PASSWORD secret first."
            exit 1
          fi
          keytool -genkeypair -keystore medicinely.jks -storetype PKCS12 \
            -alias medicinely -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Medicinely"
          base64 -w 0 medicinely.jks > KEYSTORE_BASE64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: KEYSTORE_BASE64.txt
          retention-days: 1
